name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      - name: Build Frontend Application
        run: npm run build
        env:
          CI: false

      - name: Run Backend Server & Verification Suite
        run: |
          cd server
          node server.js > server.log 2>&1 &
          SERVER_PID=$!
          cd ..
          echo "Waiting for backend server to become responsive on port 5000..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5000/api/blueprints > /dev/null 2>&1; then
              echo "✅ Backend server is UP and ready!"
              break
            fi
            echo "Waiting for server ($i/30)..."
            sleep 1
          done
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "❌ Backend server exited unexpectedly! Dumping server log:"
            cat server/server.log
            exit 1
          fi
          node tests/remediation_verification.js
        env:
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/appstruct
          JWT_SECRET: ci_test_jwt_secret_key_12345678901234567890
          GEMINI_API_KEY: ci_dummy_gemini_api_key_1234567890
          CORS_ORIGIN: http://localhost:3000